plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nextram.manager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nextram.manager'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }

    sourceSets {
        main {
            manifest.srcFile '../apk/main/AndroidManifest.xml'
            java.srcDirs = ['../apk/main/java']
            res.srcDirs = ['../apk/main/res']
            assets.srcDirs = ['../apk/main/assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.core:core:1.15.0'
}

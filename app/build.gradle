plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nextram.manager'
    compileSdk 34

    defaultConfig {
        applicationId "com.nextram.manager"
        minSdk 24
        targetSdk 34
        versionCode 22
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
